repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
        exclude: '(\.(npz|npy|pkl|pt|onnx|whl|tar\.gz|png|jpg|svg)$|^validation/reference_data/tglf_gacode_development_v2_fixture/runs/|^validation/reference_data/torax/torax_runtime_review_envelope_v1\.json$)'
      - id: trailing-whitespace
        exclude: '(\.(npz|npy|pkl|pt|onnx|whl|tar\.gz|png|jpg|svg)$|^validation/reference_data/tglf_gacode_development_v2_fixture/runs/)'

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.6
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(src/|tests/|tools/|validation/|examples/).*\.py$
      - id: ruff-format
        files: ^(src/|tests/|tools/|validation/|examples/).*\.py$

  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse

  - repo: local
    hooks:
      - id: version-metadata-consistency
        name: version metadata consistency guard
        entry: python tools/sync_metadata.py --check
        language: system
        pass_filenames: false
      - id: packaging-contract
        name: packaging contract guard
        entry: python tools/check_packaging_contract.py
        language: system
        pass_filenames: false
      - id: capability-manifest
        name: capability manifest freshness guard
        entry: bash -c "PYTHONPATH=src python tools/capability_manifest.py --check"
        language: system
        pass_filenames: false
        files: ^(src/|tests/|docs/|scpn-fusion-rs/|\.github/|pyproject\.toml|README\.md)
      - id: claims-evidence
        name: public claims evidence guard
        entry: python tools/claims_audit.py
        language: system
        pass_filenames: false
        files: ^(artifacts/|docs/|tools/claims_audit\.py|validation/claims_manifest\.json|\.pre-commit-config\.yaml|README\.md|RESULTS\.md|SECURITY\.md)
      - id: commit-trailers
        name: seat/authorship commit-message guard
        entry: python tools/check_commit_trailers.py
        language: system
        stages: [commit-msg]
      - id: bandit
        name: bandit security scan
        entry: bandit -r src/scpn_fusion -c pyproject.toml -q
        language: system
        pass_filenames: false
        files: ^src/scpn_fusion/.*\.py$
      - id: cargo-fmt-check
        name: cargo fmt --check
        entry: bash -c "cd scpn-fusion-rs && cargo fmt --all --check"
        language: system
        pass_filenames: false
        files: ^scpn-fusion-rs/
      - id: cargo-clippy
        name: cargo clippy --all-targets --all-features -- -D warnings
        entry: bash -c "cd scpn-fusion-rs && cargo clippy --all-targets --all-features -- -D warnings"
        language: system
        pass_filenames: false
        files: ^scpn-fusion-rs/
