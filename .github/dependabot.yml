# SCPN Fusion Core — source/config header compliance
# Security updates are opened as PRs so physics gates and hash-locked
# requirement regeneration still review numerical regressions before merge.
# -----------------------------------------------------------------------
version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    ignore:
      # Dependabot's GitHub Actions updater currently fails with unknown_error
      # on these pinned action refs; keep them under manual review until the
      # updater can resolve them without failing the whole scheduled run.
      - dependency-name: "dtolnay/rust-toolchain"
      - dependency-name: "taiki-e/install-action"
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
      - "security"
    ignore:
      # These releases need coherent compatibility migrations rather than
      # isolated lock-file rewrites: mypy 2.3 requires librt >=0.13, while
      # Streamlit 1.60 requires pyarrow <25.
      - dependency-name: "mypy"
        versions:
          - "2.3.0"
      - dependency-name: "streamlit"
        versions:
          - "1.60.0"
  - package-ecosystem: "pip"
    directory: "/requirements"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
      - "security"
    ignore:
      # NumPy 2.x is outside the supported runtime contract (numpy<2) and has
      # no compatible wheel for every Python version in the CI matrix.
      - dependency-name: "numpy"
        versions:
          - "2.5.1"
  - package-ecosystem: "cargo"
    directory: "/scpn-fusion-rs"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "rust"
      - "security"
  - package-ecosystem: "cargo"
    directory: "/scpn-fusion-rs/fuzz"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "rust"
      - "security"
