# SCPN Fusion Core — reusable CI validation
name: CI smoke-install
'on':
  workflow_call: {}
permissions: {}
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
jobs:
  smoke-install:
    name: Install Smoke (${{ matrix.os }} / ${{ matrix.profile }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    continue-on-error: ${{ matrix.allow_failure }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          profile: minimal
          allow_failure: false
        - os: ubuntu-latest
          profile: dev
          allow_failure: false
        - os: ubuntu-latest
          profile: full
          allow_failure: false
        - os: macos-latest
          profile: minimal
          allow_failure: false
        - os: macos-latest
          profile: dev
          allow_failure: false
        - os: macos-latest
          profile: full
          allow_failure: false
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Install selected dependency profile
      env:
        SCPN_PROFILE: ${{ matrix.profile }}
      run: |
        python - <<'PY'
        from __future__ import annotations
        import os
        import subprocess
        import sys

        profile = os.environ["SCPN_PROFILE"].strip().lower()
        reqs = {
            "minimal": "requirements/minimal.txt",
            "dev": "requirements/ci-py312.txt",
            "full": "requirements/full.txt",
        }.get(profile)
        if reqs is None:
            raise SystemExit(f"Unknown install profile: {profile}")
        subprocess.check_call([sys.executable, "-m", "pip", "install", "--require-hashes", "-r", reqs])
        subprocess.check_call([sys.executable, "-m", "pip", "install", "--no-deps", "-e", "."])
        PY
    - name: Import smoke
      env:
        SCPN_PROFILE: ${{ matrix.profile }}
      run: |
        python - <<'PY'
        from __future__ import annotations
        import importlib
        import os
        import subprocess
        import sys

        import scpn_fusion

        print("scpn_fusion version:", getattr(scpn_fusion, "__version__", "unknown"))
        profile = os.environ["SCPN_PROFILE"].strip().lower()
        if profile == "full":
            importlib.import_module("jax")
            importlib.import_module("gymnasium")
        subprocess.check_call([sys.executable, "-m", "scpn_fusion.cli", "--help"])
        PY
