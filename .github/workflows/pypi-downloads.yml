# SCPN Fusion Core — bounded daily PyPI download history

name: PyPI downloads

on:
  schedule:
    - cron: "29 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-downloads-metrics
  cancel-in-progress: false

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  snapshot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - name: Prepare the exact metrics commit without credentials
        id: prepare
        env:
          METRICS_DIR: ${{ runner.temp }}/scpn-fusion-metrics
        run: |
          set -euo pipefail
          readonly package="scpn-fusion"
          readonly csv_path="downloads/scpn-fusion.csv"
          detected="$(python tools/pypi_downloads.py \
            --pyproject pyproject.toml --print-package)"
          test "$detected" = "$package"
          remote="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"

          if git ls-remote --exit-code --heads origin metrics >/dev/null 2>&1; then
            git clone --depth 1 --branch metrics "$remote" "$METRICS_DIR"
          else
            mkdir -p "$METRICS_DIR"
            git -C "$METRICS_DIR" init --initial-branch=metrics
            git -C "$METRICS_DIR" remote add origin "$remote"
          fi

          cd "$METRICS_DIR"
          mapfile -t tracked_before < <(git ls-files)
          if (( ${#tracked_before[@]} > 1 )) || \
             (( ${#tracked_before[@]} == 1 )) && \
             [[ "${tracked_before[0]}" != "$csv_path" ]]; then
            printf 'Refusing unexpected pre-existing tracked paths:\n' >&2
            printf '  %s\n' "${tracked_before[@]}" >&2
            exit 1
          fi

          python "$GITHUB_WORKSPACE/tools/pypi_downloads.py" \
            --package "$package" \
            --csv "$csv_path" \
            --project-csv-only
          if [[ ! -f "$csv_path" ]]; then
            echo "snapshot_available=false" >> "$GITHUB_OUTPUT"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "snapshot_available=true" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$csv_path"

          mapfile -t tracked_paths < <(git ls-files)
          test "${#tracked_paths[@]}" -eq 1
          test "${tracked_paths[0]}" = "$csv_path"
          mapfile -t unstaged_paths < <(git diff --name-only)
          test "${#unstaged_paths[@]}" -eq 0
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mapfile -t staged_paths < <(git diff --cached --name-only)
          test "${#staged_paths[@]}" -eq 1
          test "${staged_paths[0]}" = "$csv_path"
          git commit --message "metrics: pypi download snapshot for ${package}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Upload the exact download series
        if: steps.prepare.outputs.snapshot_available == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pypi-downloads-scpn-fusion
          path: ${{ runner.temp }}/scpn-fusion-metrics/downloads/scpn-fusion.csv
          if-no-files-found: error
          retention-days: 30
      - name: Push only the reviewed metrics ref
        if: steps.prepare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          METRICS_DIR: ${{ runner.temp }}/scpn-fusion-metrics
        run: |
          set -euo pipefail
          askpass_path="$RUNNER_TEMP/scpn-fusion-git-askpass"
          printf '%s\n' \
            '#!/bin/sh' \
            "case \"\$1\" in" \
            "*Username*) printf '%s\\n' git ;;" \
            "*) printf '%s\\n' \"\$GH_TOKEN\" ;;" \
            'esac' > "$askpass_path"
          chmod 700 "$askpass_path"
          trap 'unlink "$askpass_path"' EXIT
          GIT_ASKPASS="$askpass_path" GIT_TERMINAL_PROMPT=0 \
            git -C "$METRICS_DIR" push origin HEAD:refs/heads/metrics
