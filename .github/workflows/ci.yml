# SCPN Fusion Core — reusable CI validation
name: CI
'on':
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch: null
permissions: {}
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci-chain-guard:
    uses: ./.github/workflows/ci-ci-chain-guard.yml
    permissions:
      actions: read
      contents: read
  lean-safety-proofs:
    uses: ./.github/workflows/ci-lean-safety-proofs.yml
    permissions:
      contents: read
    needs:
    - ci-chain-guard
  smoke-install:
    uses: ./.github/workflows/ci-smoke-install.yml
    permissions:
      contents: read
    needs:
    - ci-chain-guard
  python-tests:
    uses: ./.github/workflows/ci-python-tests.yml
    permissions:
      contents: read
    needs:
    - ci-chain-guard
    - lean-safety-proofs
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  python-research-gate:
    uses: ./.github/workflows/ci-python-research-gate.yml
    permissions:
      contents: read
    needs:
    - python-tests
  geometry-3d-smoke:
    uses: ./.github/workflows/ci-geometry-3d-smoke.yml
    permissions:
      contents: read
    needs:
    - python-tests
  runtime-parity-perf-gate:
    uses: ./.github/workflows/ci-runtime-parity-perf-gate.yml
    permissions:
      contents: read
    needs:
    - python-tests
  rust-tests:
    uses: ./.github/workflows/ci-rust-tests.yml
    permissions:
      contents: read
    needs:
    - ci-chain-guard
  rust-python-interop:
    uses: ./.github/workflows/ci-rust-python-interop.yml
    permissions:
      contents: read
    needs:
    - rust-tests
  rust-coverage:
    uses: ./.github/workflows/ci-rust-coverage.yml
    permissions:
      contents: read
    needs:
    - ci-chain-guard
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  rust-fuzz:
    uses: ./.github/workflows/ci-rust-fuzz.yml
    permissions:
      contents: read
    needs:
    - rust-tests
  rust-benchmarks:
    uses: ./.github/workflows/ci-rust-benchmarks.yml
    permissions:
      contents: read
    needs:
    - ci-chain-guard
  validation-regression:
    uses: ./.github/workflows/ci-validation-regression.yml
    permissions:
      contents: read
    needs:
    - python-tests
    - rust-python-interop
    - rust-tests
  stress-test:
    uses: ./.github/workflows/ci-stress-test.yml
    permissions:
      contents: read
    needs:
    - python-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
  studio-conformance:
    uses: ./.github/workflows/ci-studio-conformance.yml
    permissions:
      contents: read
    needs:
    - ci-chain-guard
  reference-evidence:
    uses: ./.github/workflows/ci-reference-evidence.yml
    permissions:
      contents: read
    needs:
    - python-tests
  dependency-policy:
    uses: ./.github/workflows/ci-dependency-policy.yml
    permissions:
      contents: read
    needs:
    - ci-chain-guard
  required-gate:
    name: Python 3.12
    needs:
    - ci-chain-guard
    - dependency-policy
    - geometry-3d-smoke
    - lean-safety-proofs
    - python-research-gate
    - python-tests
    - reference-evidence
    - runtime-parity-perf-gate
    - rust-benchmarks
    - rust-coverage
    - rust-fuzz
    - rust-python-interop
    - rust-tests
    - smoke-install
    - stress-test
    - studio-conformance
    - validation-regression
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
    - name: Require every declared CI category
      env:
        CATEGORY_RESULTS: ${{ toJSON(needs) }}
        EXPECTED_CATEGORIES: '["ci-chain-guard", "dependency-policy", "geometry-3d-smoke", "lean-safety-proofs",
          "python-research-gate", "python-tests", "reference-evidence", "runtime-parity-perf-gate", "rust-benchmarks",
          "rust-coverage", "rust-fuzz", "rust-python-interop", "rust-tests", "smoke-install", "stress-test",
          "studio-conformance", "validation-regression"]'
        EVENT_NAME: ${{ github.event_name }}
        REF_NAME: ${{ github.ref }}
      run: |
        python - <<'PY'
        import json
        import os

        results = json.loads(os.environ['CATEGORY_RESULTS'])
        expected = json.loads(os.environ['EXPECTED_CATEGORIES'])
        if set(results) != set(expected):
            raise SystemExit('CI category inventory mismatch')
        stress_required = os.environ['EVENT_NAME'] == 'push' and os.environ['REF_NAME'] == 'refs/heads/main'
        for name in expected:
            status = results[name]['result']
            if status == 'success':
                continue
            if name == 'stress-test' and status == 'skipped' and not stress_required:
                continue
            raise SystemExit(f'{name}: {status}')
        PY
