# SCPN Fusion Core — reusable CI validation
name: CI studio-conformance
'on':
  workflow_call: {}
permissions: {}
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
jobs:
  studio-conformance:
    name: Studio Federation Conformance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        lfs: false
    - name: Set up Python 3.12
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        pip install --require-hashes -r requirements/ci-py312.txt
        pip install --no-deps -e .
    - name: Install studio federation SDK
      run: pip install --require-hashes -r requirements/studio.txt
    - name: Studio schema-A federation tests
      run: pytest tests/test_studio_manifest.py -v
    - name: Studio manifest drift guard
      run: python -m scpn_fusion.studio.federation --check
