# SCPN Fusion Core — reusable CI validation
name: CI lean-safety-proofs
'on':
  workflow_call: {}
permissions: {}
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
jobs:
  lean-safety-proofs:
    name: Lean Safety Proofs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Install Lean toolchain
      run: |
        curl --retry 5 --retry-all-errors --retry-delay 10 \
          --connect-timeout 20 --max-time 120 -fsSL \
          https://raw.githubusercontent.com/leanprover/elan/b6cec7e10fe4965a605aaf60d1cb4a5837f0462b/elan-init.sh \
          -o /tmp/elan-init.sh
        echo "a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53  /tmp/elan-init.sh" | sha256sum -c -
        sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.29.1
        echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
    - name: Build Lean safety + compiler-contract proof surface
      run: |
        cd scpn-fusion-lean
        lake build
    - name: Assert proofs are complete (no sorry/admit stubs)
      run: "cd scpn-fusion-lean\nif grep -rnE '\\bsorry\\b|\\badmit\\b|sorryAx' -- *.lean; then\n  echo\
        \ \"::error::Lean proofs contain a sorry/admit stub \u2014 the contract is not proven\"\n  exit\
        \ 1\nfi\necho \"All Lean proofs are complete (no sorry/admit).\"\n"
