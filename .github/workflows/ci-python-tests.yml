# SCPN Fusion Core — reusable CI validation
#
# The release test suite runs in four duration-balanced shards per interpreter
# (tools/ci_test_shards.py, timing snapshot tools/ci_test_timings.json). Next to
# the shards, one job per interpreter collects the complete admitted suite and
# verifies the CI contracts, and one Python 3.12 job runs the release preflight.
# ci-python-test-union.yml then requires every admitted test exactly once per
# interpreter and applies the coverage thresholds once, to the union of the
# Python 3.12 shards. All three jobs here share the same environment set-up, so
# the inventory is collected in the environment the shards run in.
name: CI python-tests
'on':
  workflow_call: {}
permissions: {}
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
jobs:
  python-tests:
    name: Python ${{ matrix.python-version }} shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version:
        - '3.11'
        - '3.12'
        shard:
        - 1
        - 2
        - 3
        - 4
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        lfs: false
    - name: Checkout pinned DREAM Python API fixture
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: chalmersplasmatheory/DREAM
        ref: ecdd5e146537c77602c9d7cc76b36100200e4b9a
        path: data/external/full_fidelity_public_sources/repos/dream
        fetch-depth: 1
        lfs: false
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Lean toolchain for polyglot solver contracts
      run: |
        curl --retry 5 --retry-all-errors --retry-delay 10 \
          --connect-timeout 20 --max-time 120 -fsSL \
          https://raw.githubusercontent.com/leanprover/elan/b6cec7e10fe4965a605aaf60d1cb4a5837f0462b/elan-init.sh \
          -o /tmp/elan-init.sh
        echo "a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53  /tmp/elan-init.sh" | sha256sum -c -
        sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.29.1
        echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
    # ubuntu-latest (Ubuntu 26.04) no longer preinstalls Julia.
    - name: Install Julia for polyglot solver contracts
      uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687  # v3.0.3
      with:
        version: "1.10"
    - name: Install dependencies
      run: |
        pyver="${{ matrix.python-version }}"
        pytag="${pyver//.}"
        if [ "$pyver" = "3.12" ]; then
          pip install --require-hashes -r requirements/ci-benchmark.txt
        else
          pip install --require-hashes -r "requirements/ci-py${pytag}.txt"
        fi
        pip install --no-deps -e .
    - name: Install Rust toolchain for native public tests
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
    - name: Build and install this checkout's Rust extension
      run: |
        maturin build --release --manifest-path scpn-fusion-rs/crates/fusion-python/Cargo.toml --out artifacts/native-wheels
        python -m pip install --no-deps artifacts/native-wheels/*.whl
        python -c "import scpn_fusion_rs; print(scpn_fusion_rs.__file__)"
    - name: Verify embedded neurocore backend (Python 3.12 lane)
      if: matrix.python-version == '3.12'
      run: |
        python - <<'PY'
        from scpn_fusion.neurocore_compat import SC_NEUROCORE_AVAILABLE, SC_NEUROCORE_BACKEND

        if not SC_NEUROCORE_AVAILABLE:
            raise SystemExit("Embedded neurocore backend unavailable.")
        print(f"Embedded neurocore backend active: {SC_NEUROCORE_BACKEND}")
        PY
    - name: Run this shard of the release test suite (exclude experimental-only lanes)
      # Measure even after an earlier step fails; cancellation still stops the suite.
      if: ${{ !cancelled() }}
      run: |
        # Python 3.12 is the coverage lane: each shard keeps its own data file
        # for the union, and no shard applies a threshold on its own.
        out="$RUNNER_TEMP/test-shard"
        if [ "${{ matrix.python-version }}" = "3.12" ]; then
          export COVERAGE_FILE="$out/.coverage.shard-${{ matrix.shard }}"
          lane_args=(-q --cov=scpn_fusion --cov-branch --cov-report=)
        else
          lane_args=(-v)
        fi
        python tools/ci_test_shards.py run --lane "${{ matrix.python-version }}" \
          --shard "${{ matrix.shard }}/4" --timings tools/ci_test_timings.json \
          --out-dir "$out" --timeout-minutes 75 -- "${lane_args[@]}"
    - name: Upload this shard's manifest, JUnit report, log and coverage data
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: python-shard-${{ matrix.python-version }}-${{ matrix.shard }}
        include-hidden-files: true
        if-no-files-found: error
        overwrite: true
        path: ${{ runner.temp }}/test-shard/
  python-test-inventory:
    name: Python ${{ matrix.python-version }} test inventory and CI contracts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version:
        - '3.11'
        - '3.12'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        lfs: false
    - name: Checkout pinned DREAM Python API fixture
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: chalmersplasmatheory/DREAM
        ref: ecdd5e146537c77602c9d7cc76b36100200e4b9a
        path: data/external/full_fidelity_public_sources/repos/dream
        fetch-depth: 1
        lfs: false
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Lean toolchain for polyglot solver contracts
      run: |
        curl --retry 5 --retry-all-errors --retry-delay 10 \
          --connect-timeout 20 --max-time 120 -fsSL \
          https://raw.githubusercontent.com/leanprover/elan/b6cec7e10fe4965a605aaf60d1cb4a5837f0462b/elan-init.sh \
          -o /tmp/elan-init.sh
        echo "a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53  /tmp/elan-init.sh" | sha256sum -c -
        sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.29.1
        echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
    # ubuntu-latest (Ubuntu 26.04) no longer preinstalls Julia.
    - name: Install Julia for polyglot solver contracts
      uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687  # v3.0.3
      with:
        version: "1.10"
    - name: Install dependencies
      run: |
        pyver="${{ matrix.python-version }}"
        pytag="${pyver//.}"
        if [ "$pyver" = "3.12" ]; then
          pip install --require-hashes -r requirements/ci-benchmark.txt
        else
          pip install --require-hashes -r "requirements/ci-py${pytag}.txt"
        fi
        pip install --no-deps -e .
    - name: Install Rust toolchain for native public tests
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
    - name: Build and install this checkout's Rust extension
      run: |
        maturin build --release --manifest-path scpn-fusion-rs/crates/fusion-python/Cargo.toml --out artifacts/native-wheels
        python -m pip install --no-deps artifacts/native-wheels/*.whl
        python -c "import scpn_fusion_rs; print(scpn_fusion_rs.__file__)"
    - name: Verify distributed CI contracts
      run: |
        python tools/check_ci_workflow_ownership.py
        python tools/check_definition_docstrings.py tools/check_ci_workflow_ownership.py tools/ci_test_shards.py tools/run_python_preflight.py tests/test_check_ci_workflow_ownership.py tests/test_ci_test_shards.py tests/test_ci_workflow_references.py tests/test_tools_run_python_preflight.py
        mkdir -p "$RUNNER_TEMP/ci-ownership-coverage"
        export COVERAGE_FILE="$RUNNER_TEMP/ci-ownership-coverage/.coverage"
        export COVERAGE_RCFILE="$PWD/tools/ci_workflow_coverage.ini"
        python -m coverage run -m pytest tests/test_check_ci_workflow_ownership.py tests/test_ci_test_shards.py tests/test_ci_workflow_references.py --no-cov
        python -m coverage combine --keep
        python -m coverage json --keep-combined -o "$RUNNER_TEMP/ci-ownership-coverage/report.json"
        python -m coverage report --keep-combined
    - name: Collect the complete admitted suite of this interpreter
      if: ${{ !cancelled() }}
      run: |
        python tools/ci_test_shards.py inventory --lane "${{ matrix.python-version }}" \
          --output "$RUNNER_TEMP/test-inventory/inventory.json"
    - name: Upload the test inventory
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: python-inventory-${{ matrix.python-version }}
        if-no-files-found: error
        overwrite: true
        path: ${{ runner.temp }}/test-inventory/
    - name: Upload CI ownership coverage
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: ci-ownership-${{ matrix.python-version }}
        include-hidden-files: true
        overwrite: true
        path: ${{ runner.temp }}/ci-ownership-coverage/
  python-release-gate:
    name: Python ${{ matrix.python-version }} release preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version:
        - '3.12'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        lfs: false
    - name: Checkout pinned DREAM Python API fixture
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: chalmersplasmatheory/DREAM
        ref: ecdd5e146537c77602c9d7cc76b36100200e4b9a
        path: data/external/full_fidelity_public_sources/repos/dream
        fetch-depth: 1
        lfs: false
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Lean toolchain for polyglot solver contracts
      run: |
        curl --retry 5 --retry-all-errors --retry-delay 10 \
          --connect-timeout 20 --max-time 120 -fsSL \
          https://raw.githubusercontent.com/leanprover/elan/b6cec7e10fe4965a605aaf60d1cb4a5837f0462b/elan-init.sh \
          -o /tmp/elan-init.sh
        echo "a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53  /tmp/elan-init.sh" | sha256sum -c -
        sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.29.1
        echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
    # ubuntu-latest (Ubuntu 26.04) no longer preinstalls Julia.
    - name: Install Julia for polyglot solver contracts
      uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687  # v3.0.3
      with:
        version: "1.10"
    - name: Install dependencies
      run: |
        pyver="${{ matrix.python-version }}"
        pytag="${pyver//.}"
        if [ "$pyver" = "3.12" ]; then
          pip install --require-hashes -r requirements/ci-benchmark.txt
        else
          pip install --require-hashes -r "requirements/ci-py${pytag}.txt"
        fi
        pip install --no-deps -e .
    - name: Install Rust toolchain for native public tests
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
    - name: Build and install this checkout's Rust extension
      run: |
        maturin build --release --manifest-path scpn-fusion-rs/crates/fusion-python/Cargo.toml --out artifacts/native-wheels
        python -m pip install --no-deps artifacts/native-wheels/*.whl
        python -c "import scpn_fusion_rs; print(scpn_fusion_rs.__file__)"
    - name: Verify embedded neurocore backend (Python 3.12 lane)
      run: |
        python - <<'PY'
        from scpn_fusion.neurocore_compat import SC_NEUROCORE_AVAILABLE, SC_NEUROCORE_BACKEND

        if not SC_NEUROCORE_AVAILABLE:
            raise SystemExit("Embedded neurocore backend unavailable.")
        print(f"Embedded neurocore backend active: {SC_NEUROCORE_BACKEND}")
        PY
    - name: Python preflight release gate
      env:
        SCPN_ENABLE_STRICT_BACKEND_CHECKS: '1'
      run: |
        python tools/run_python_preflight.py --gate release
    - name: Reject silent tracked evidence drift
      run: git diff --exit-code -- artifacts validation/reports
    - name: Disruption false-positive rate gate
      run: |
        python -c "
        from scpn_fusion.control.disruption_predictor import run_anomaly_alarm_campaign
        r = run_anomaly_alarm_campaign(seed=42, episodes=32, window=64)
        assert r['false_positive_rate'] <= 0.10, f'FPR {r[\"false_positive_rate\"]:.3f} exceeds 10%%'
        "
    - name: Upload Python 3.12 release preflight diagnostics
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: python312-release-preflight-diagnostics
        if-no-files-found: warn
        overwrite: true
        path: |
          artifacts/untested_module_guard_summary.json
          artifacts/deprecated_default_lane_guard_summary.json
          artifacts/release_delta_guard_summary.json
          artifacts/claim_range_guard_summary.json
