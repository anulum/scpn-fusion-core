# SCPN Fusion Core — reusable CI validation
name: CI runtime-parity-perf-gate
'on':
  workflow_call: {}
permissions: {}
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
jobs:
  runtime-parity-perf-gate:
    name: Runtime Parity + Perf Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        lfs: false
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        pip install --require-hashes -r requirements/ci-py312.txt
        pip install --no-deps -e .
    - name: Generate parity and latency artifacts
      run: |
        python validation/traceable_runtime_parity.py --strict \
          --output-json artifacts/traceable_runtime_parity.json \
          --output-md artifacts/traceable_runtime_parity.md
        python validation/scpn_end_to_end_latency.py --strict \
          --output-json artifacts/_local_scpn_end_to_end_latency_ci.json \
          --output-md artifacts/_local_scpn_end_to_end_latency_ci.md
    - name: Runtime parity/perf guard
      run: |
        python tools/runtime_parity_perf_guard.py \
          --parity artifacts/traceable_runtime_parity.json \
          --latency artifacts/_local_scpn_end_to_end_latency_ci.json \
          --thresholds tools/runtime_parity_perf_thresholds.json \
          --summary-json artifacts/runtime_parity_perf_guard_summary.json
    - name: Upload runtime parity/perf artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: runtime-parity-perf-gate
        path: |
          artifacts/traceable_runtime_parity.json
          artifacts/traceable_runtime_parity.md
          artifacts/_local_scpn_end_to_end_latency_ci.json
          artifacts/_local_scpn_end_to_end_latency_ci.md
          artifacts/runtime_parity_perf_guard_summary.json
