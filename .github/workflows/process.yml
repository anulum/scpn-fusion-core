# SCPN Fusion Core — optional PROCESS reference integration
name: PROCESS integration
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ukaea/PROCESS
          ref: 620d1e9a38f1b3c6d2597956c8556e9ab6c17037
          path: .process-source
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install isolated pinned upstream
        run: |
          python -m venv "$RUNNER_TEMP/process-env"
          "$RUNNER_TEMP/process-env/bin/python" -m pip install -r requirements/process.txt pytest==9.1.1 ruff==0.16.0 mypy==1.19.1 coverage==7.15.2
      - name: Generate actual upstream output and verify diagnostic contracts
        env:
          PYTHONPATH: .
          PROCESS_TEST_CASE: .process-source/examples/data/large_tokamak_eval_IN.DAT
        run: |
          export COVERAGE_RCFILE="$PWD/.coveragerc.process"
          export COVERAGE_FILE="$RUNNER_TEMP/process.coverage"
          "$RUNNER_TEMP/process-env/bin/python" -m coverage run -m pytest integration_tests/process -q
          "$RUNNER_TEMP/process-env/bin/python" -m coverage combine
          "$RUNNER_TEMP/process-env/bin/python" -m coverage json --fail-under=0 -o "$RUNNER_TEMP/process-coverage.json"
          "$RUNNER_TEMP/process-env/bin/python" -m coverage report
      - name: Enforce strict typing and NumPy docstrings on the adapter and tests
        env:
          PYTHONPATH: .
        run: |
          "$RUNNER_TEMP/process-env/bin/python" -m mypy --strict validation/process_power_report.py validation/process_reference_run.py integration_tests/process
          "$RUNNER_TEMP/process-env/bin/python" -m ruff check validation/process_power_report.py validation/process_reference_run.py integration_tests/process
          "$RUNNER_TEMP/process-env/bin/python" -m ruff check --select D --config 'lint.pydocstyle.convention="numpy"' validation/process_power_report.py validation/process_reference_run.py integration_tests/process
