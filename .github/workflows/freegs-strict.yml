# SCPN Fusion Core — FreeGS Strict Public Example Parity Gate
name: FreeGS Strict Public Example Parity Gate

on:
  schedule:
    - cron: "23 4 * * 2"
  workflow_dispatch:

concurrency:
  group: freegs-strict-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  FREEGS_SOURCE_URL: https://github.com/freegs-plasma/freegs.git
  FREEGS_SOURCE_COMMIT: 9fbec2056b4322ea253bb5614896d549365163f3

jobs:
  freegs-strict:
    name: FreeGS Strict Parity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --require-hashes -r requirements/ci-benchmark.txt
          pip install --no-deps -e .

      - name: Provision pinned FreeGS public example sources
        run: |
          cache_path="data/external/full_fidelity_public_sources/repos/freegs"
          mkdir -p "$(dirname "$cache_path")"
          git init "$cache_path"
          git -C "$cache_path" remote add origin "$FREEGS_SOURCE_URL"
          git -C "$cache_path" fetch --depth 1 origin "$FREEGS_SOURCE_COMMIT"
          git -C "$cache_path" checkout --detach FETCH_HEAD
          test "$(git -C "$cache_path" rev-parse HEAD)" = "$FREEGS_SOURCE_COMMIT"

      - name: Run and enforce fresh FreeGS public-example artifact contract
        run: |
          python tools/check_freegs_strict_artifact.py \
            --run-public-example \
            --report artifacts/freegs_public_example_strict_live.json \
            --summary-json artifacts/freegs_strict_guard_summary.json

      - name: Enforce published strict parity contract
        run: |
          python validation/benchmark_free_boundary_strict_parity.py \
            --check \
            --strict

      - name: Upload FreeGS strict artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: freegs-strict-gate
          if-no-files-found: error
          path: |
            artifacts/freegs_public_example_strict_live.json
            artifacts/freegs_strict_guard_summary.json
            validation/reports/free_boundary_strict_parity_benchmark.json
