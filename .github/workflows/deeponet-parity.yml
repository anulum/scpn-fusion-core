# SCPN Fusion Core — focused native DeepONet parity diagnostics
name: DeepONet CLI parity
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  PYTHONPATH: src:.
  JAX_PLATFORMS: cpu
jobs:
  native-parity:
    name: Native DeepONet parity (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: false
          persist-credentials: false
      - name: Checkout pinned DREAM Python API fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: chalmersplasmatheory/DREAM
          ref: ecdd5e146537c77602c9d7cc76b36100200e4b9a
          path: data/external/full_fidelity_public_sources/repos/dream
          fetch-depth: 1
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the main CI hash-locked profile
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          pytag="${PYTHON_VERSION//.}"
          profile="requirements/ci-py${pytag}.txt"
          if [ "$PYTHON_VERSION" = "3.12" ]; then
            profile="requirements/ci-benchmark.txt"
          fi
          git rev-parse HEAD > "$RUNNER_TEMP/source-head.txt"
          sha256sum "$profile" > "$RUNNER_TEMP/requirements.sha256"
          python -m pip install --require-hashes -r "$profile"
          python -m pip install --no-deps -e .
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
      - name: Build and require this checkout's native DeepONet runtime
        run: |
          maturin build --release --locked --manifest-path scpn-fusion-rs/crates/fusion-python/Cargo.toml --out artifacts/native-wheels
          python -m pip install --no-deps artifacts/native-wheels/*.whl
          python -c "import scpn_fusion_rs; assert hasattr(scpn_fusion_rs, 'PyDeepOnetEquilibrium'); print(scpn_fusion_rs.__file__)"
      - name: Execute original public runtime and CLI parity cases
        run: |
          set -o pipefail
          python -m pytest tests/test_deeponet_equilibrium.py tests/test_machine_conditioned_deeponet_training.py::test_deeponet_cli_trains_a_runtime_loadable_artifact -v 2>&1 | tee "$RUNNER_TEMP/parity.log"
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: deeponet-parity-${{ matrix.python-version }}
          retention-days: 14
          path: |
            ${{ runner.temp }}/source-head.txt
            ${{ runner.temp }}/requirements.sha256
            ${{ runner.temp }}/parity.log
