# SCPN Fusion Core — complete FAIR-MAST magnetic archive gate
name: Complete FAIR-MAST Magnetic Archive

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: mast-complete-magnetic-archive-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  complete-magnetic-archive:
    name: Acquire and verify every magnetic object and array
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/mast.txt
      - name: Install hash-locked MAST profile
        run: |
          python -m pip install --require-hashes -r requirements/mast.txt
          python -m pip install --no-deps -e .
      - name: Acquire and qualify the complete authentic group
        run: |
          python validation/verify_mast_magnetic_diagnostic_qualification.py \
            --report artifacts/mast-magnetic-diagnostic-qualification.json
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: mast-complete-magnetic-archive
          path: artifacts/mast-magnetic-diagnostic-qualification.json
          if-no-files-found: error
