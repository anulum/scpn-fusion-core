# SCPN Fusion Core — source/config header compliance
[build-system]
requires = ["maturin>=1.14.1,<2.0"]
build-backend = "maturin"

[project]
name = "scpn-fusion-rs"
version = "4.0.0"
description = "Native Rust acceleration for SCPN Fusion Core"
readme = "README.md"
license = "AGPL-3.0-or-later"
authors = [
    { name = "Miroslav Sotek", email = "protoscience@anulum.li" },
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Physics",
]
keywords = ["fusion", "plasma", "rust", "pyo3", "tokamak"]

[project.urls]
Homepage = "https://github.com/anulum/scpn-fusion-core"
Documentation = "https://anulum.github.io/scpn-fusion-core/"
Repository = "https://github.com/anulum/scpn-fusion-core"
"Bug Tracker" = "https://github.com/anulum/scpn-fusion-core/issues"

[tool.maturin]
bindings = "pyo3"
features = ["pyo3/extension-module"]
module-name = "scpn_fusion_rs"
strip = true
