# SCPN Fusion Core — source/config header compliance
[package]
authors = ["Miroslav Sotek <protoscience@anulum.li>"]
license = "AGPL-3.0-or-later"
name = "scpn-fusion-rs"
version = "4.0.0"
edition = "2021"
description = "Native Rust acceleration for SCPN Fusion Core via PyO3"
homepage = "https://github.com/anulum/scpn-fusion-core"
repository = "https://github.com/anulum/scpn-fusion-core"
readme = "README.md"

[lib]
name = "scpn_fusion_rs"
crate-type = ["cdylib"]

[features]
default = []
gpu = ["fusion-gpu"]

[dependencies]
fusion-types = { path = "../fusion-types" }
fusion-math = { path = "../fusion-math" }
fusion-core = { path = "../fusion-core" }
fusion-physics = { path = "../fusion-physics" }
fusion-phase = { path = "../fusion-phase" }
fusion-nuclear = { path = "../fusion-nuclear" }
fusion-engineering = { path = "../fusion-engineering" }
fusion-control = { path = "../fusion-control" }
fusion-diagnostics = { path = "../fusion-diagnostics" }
fusion-ml = { path = "../fusion-ml" }
fusion-gpu = { path = "../fusion-gpu", optional = true }
pyo3 = { workspace = true }
numpy = { workspace = true }
ndarray = { workspace = true }
num-complex = { workspace = true }
rand = { workspace = true }
